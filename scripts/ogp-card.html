<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  /* 1200x600 (2:1) OGP カード。背景は跳躍の弧と飛び石（Lovart生成）。
     書き出し:
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
         --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
         --window-size=1200,600 --screenshot=../ogp.png scripts/ogp-card.html
     ※ 2026-08-27 修正: 2行目が「式札の道を、月まで」だった。式札は前作
       （式札かさね）のモチーフで、本作は石の台座を渡る遊び。meta の
       og:description（石の道を、月まで）とも食い違っていたので直した。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 600px;
    overflow: hidden;
    position: relative;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    color: #E8E4D8;
    background: #131320;
  }
  .bg {
    position: absolute;
    inset: 0;
    background: url("../assets/art/ogp-bg.jpg") center / cover no-repeat;
  }
  /* 左を沈めて文字を乗せる。右の月と跳躍の弧は明るいまま残す */
  .veil {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg,
      rgba(13,13,26,.90) 0%, rgba(13,13,26,.68) 34%, rgba(13,13,26,.10) 62%, rgba(13,13,26,0) 78%);
  }
  .content { position: absolute; left: 72px; top: 150px; }
  h1 {
    font-size: 104px;
    font-weight: 800;
    letter-spacing: .12em;
    line-height: 1.1;
    white-space: nowrap;
    background: linear-gradient(168deg, #f6e5ae 15%, #D9A94C 55%, #F0CE7E 85%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 26px rgba(240,206,126,.4)) drop-shadow(0 3px 10px rgba(0,0,0,.7));
  }
  .tagline {
    margin-top: 26px;
    font-size: 29px;
    letter-spacing: .12em;
    line-height: 1.9;
    white-space: nowrap;
    text-shadow: 0 1px 8px rgba(0,0,0,.85);
  }
  .tagline .dim { color: #C9C2D8; }
  .credit {
    position: absolute;
    left: 74px;
    bottom: 46px;
    font-size: 20px;
    letter-spacing: .14em;
    color: #9D93B5;
    white-space: nowrap;
    text-shadow: 0 1px 8px rgba(0,0,0,.85);
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="veil"></div>
  <div class="content">
    <h1>月影とび</h1>
    <div class="tagline">
      長押しで力を溜め、離して跳ぶ<br>
      <span class="dim">石の道を、月まで</span>
    </div>
  </div>
  <div class="credit">月蝕綺譚 -Luna Occulta- 二次創作ファンゲーム</div>
</body>
</html>
